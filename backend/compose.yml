services:
  database:
    image: postgres:18.2-alpine3.23
    container_name: linkhub-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
    volumes:
      - linkhub-db-data:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    image: ghcr.io/nekogravitycat/linkhub-backend:latest
    container_name: linkhub-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      APP_ENV: ${APP_ENV}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
      POSTGRES_ADDR: database
      POSTGRES_PORT: 5432
    depends_on:
      database:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    container_name: linkhub-nginx
    restart: always
    ports:
      - "8001:8001" # API Domain
      - "8002:8002" # Redirection Domain
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/404.html:/usr/share/nginx/html/404.html:ro
    depends_on:
      - api

  # Operational tooling only: PostgreSQL backup/restore/cutover/rollback.
  # Not part of the normal `docker compose up -d` stack -- only runs when
  # explicitly invoked with `--profile ops`. See ops/backup/README.md.
  backup:
    image: linkhub-backup
    container_name: linkhub-backup
    profiles: ["ops"]
    build:
      context: ../ops/backup
      dockerfile: Dockerfile
    env_file:
      - .env
      - .env.backup
    environment:
      POSTGRES_ADDR: database
      POSTGRES_PORT: 5432
    depends_on:
      database:
        condition: service_healthy

volumes:
  linkhub-db-data:
