user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;

  upstream backend_api {
    server api:8080;
  }
    
  # -------------------------------------------------------------------------
  # Security: Timeouts & Buffer Limits
  # Mitigates Slowloris and buffer overflow attacks.
  # -------------------------------------------------------------------------

  keepalive_timeout 65;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 10s;

  # Limits the maximum allowed size of the client request body.
  client_max_body_size 128k;

  # -------------------------------------------------------------------------
  # Security: Information Disclosure
  # -------------------------------------------------------------------------

  server_tokens off;

  # -------------------------------------------------------------------------
  # Security: HTTP Headers
  # Adds basic security headers to all responses.
  # -------------------------------------------------------------------------

  # Prevents clickjacking attacks.
  add_header X-Frame-Options SAMEORIGIN always;
  # Prevents browser from MIME-sniffing a response away from the declared content-type.
  add_header X-Content-Type-Options nosniff always;
  # Basic XSS protection for older browsers.
  add_header X-XSS-Protection "1; mode=block" always;
  # Referrer Policy to control how much referrer information is sent.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # -------------------------------------------------------------------------
  # Rate Limiting Zones
  # Define shared memory zones for rate limiting.
  # -------------------------------------------------------------------------
  
  # Strict Zone for API (Heavy Logic)
  limit_req_zone $binary_remote_addr zone=api_strict:10m rate=2r/s;

  # Loose Zone for Redirection (Light Logic)
  # Designed to handle bursts but stop high-speed scraping/scanning.
  limit_req_zone $binary_remote_addr zone=redirect_loose:10m rate=10r/s;

  # =========================================================================
  # Server Block 1: API Domain (Port 8001)
  # =========================================================================

  server {
    listen 8001 default_server;

    # Strict limit for API.
    limit_req zone=api_strict burst=5 nodelay;

    location / {
      proxy_pass http://backend_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # =========================================================================
  # Server Block 2: Redirection Domain (Port 8002)
  # =========================================================================

  server {
    listen 8002 default_server;

    # Looser limit for Redirection.
    limit_req zone=redirect_loose burst=10 nodelay;

    error_page 404 /404.html;

    location = /404.html {
      internal;
      root /usr/share/nginx/html;
    }

    location = / {
      return 404;
    }

    # Regex location for redirection logic
    location ~ ^/([a-zA-Z0-9\-_]+)$ {
      rewrite ^/(.*)$ /redirect/$1 break;

      proxy_pass http://backend_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_intercept_errors on; # Show custom error page
    }
  }
}
